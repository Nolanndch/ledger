<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d1113">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Geist:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
<script>
  // Avant le premier affichage : thème et mode discret de cet appareil, pour éviter un flash.
  try {
    const t = JSON.parse(localStorage.getItem("ledger.ui.theme") || '"system"');
    if (t !== "system") document.documentElement.setAttribute("data-theme", t);
    if (localStorage.getItem("ledger.ui.discreet") === "true") document.documentElement.classList.add("discreet");
  } catch {}
</script>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><b>Ledger</b><span>registre</span></div>

    <nav class="nav" id="nav" aria-label="Sections">
      <button class="nav-item" data-view="dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span class="grow">Tableau de bord</span></button>
      <button class="nav-item" data-view="ledger"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 10h16M4 15h16M4 20h10"/></svg><span class="grow">Grand livre</span><span class="count" id="navCountTx"></span></button>
      <button class="nav-item" data-view="analytics"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="grow">Analyse</span></button>
      <button class="nav-item" data-view="subscriptions"><svg viewBox="0 0 24 24"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg><span class="grow">Abonnements</span><span class="count" id="navCountRec"></span></button>
      <button class="nav-item" data-view="objectives"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg><span class="grow">Objectifs</span></button>
      <button class="nav-item" data-view="investments"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg><span class="grow">Investissements</span><span class="count" id="navCountInv"></span></button>
      <button class="nav-item" data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span class="grow">Réglages</span></button>
    </nav>

    <div>
      <div class="nav-label">Business <button id="manageDomainsLink">Gérer</button></div>
      <div class="nav" id="domainNav"></div>
    </div>

    <div class="side-foot">
      <button class="db-pill busy" id="dbPill" title="Base de données locale">
        <span class="led"></span>
        <span><strong id="dbTitle">Connexion…</strong><small id="dbSub">base locale</small></span>
      </button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main" id="main">
    <header class="topbar">
      <div class="topbar-in">
        <button class="menu-btn" id="menuBtn" aria-label="Ouvrir le menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div>
          <h1 id="viewTitle">Tableau de bord</h1>
          <div class="scope" id="viewScope"></div>
        </div>
        <div class="spacer"></div>
        <div class="period-picker" id="periodPicker">
          <button class="btn period-btn" id="periodBtn" aria-haspopup="true" aria-expanded="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span id="periodBtnLabel">Tout</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>
          <div class="period-pop" id="periodPop" hidden>
            <div class="period-presets">
              <button data-p="month">Ce mois</button><button data-p="lastMonth">Mois dernier</button>
              <button data-p="3m">3 derniers mois</button><button data-p="12m">12 derniers mois</button>
              <button data-p="year">Cette année</button><button data-p="lastYear">Année dernière</button>
              <button data-p="all">Tout</button>
            </div>
            <form class="period-custom" id="periodCustom">
              <span class="label">Personnalisée</span>
              <div class="period-dates"><input class="input" type="date" id="periodFrom" aria-label="Du" required><span class="faint">→</span><input class="input" type="date" id="periodTo" aria-label="Au" required></div>
              <button class="btn small primary">Appliquer</button>
            </form>
          </div>
        </div>
        <button class="icon-btn eye-btn" id="discreetBtn" title="Mode discret (H) : masquer les montants" aria-pressed="false"><svg viewBox="0 0 24 24"><path class="eye-open" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle class="eye-open" cx="12" cy="12" r="3"/><path class="eye-closed" d="M3 3l18 18M10.6 5.1A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a10 10 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>
        <button class="btn primary" id="addTxBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="add-label">Mouvement</span> <kbd class="hide-sm">N</kbd></button>
      </div>
    </header>

    <div class="content">
      <div class="banner" id="offlineBanner" hidden>
        <span><b>Le serveur Ledger ne répond pas.</b> Tes données sont en sécurité dans la base locale. <span class="only-web">Relance-le avec <code>node server.mjs</code>.</span><span class="only-app">Quitte et relance l'application.</span></span>
        <button class="btn small" id="retryBtn">Réessayer</button>
      </div>

      <section class="view" id="view-dashboard"></section>
      <section class="view" id="view-ledger" hidden></section>
      <section class="view" id="view-analytics" hidden></section>
      <section class="view" id="view-subscriptions" hidden></section>
      <section class="view" id="view-objectives" hidden></section>
      <section class="view" id="view-investments" hidden></section>
      <section class="view" id="view-settings" hidden></section>
    </div>
  </main>
</div>

<datalist id="descList"></datalist>
<datalist id="counterpartyList"></datalist>
<datalist id="assetList"></datalist>

<!-- Confirmation -->
<dialog id="confirmDialog">
  <form method="dialog">
    <h3 id="confirmTitle">Confirmer</h3>
    <p class="muted" id="confirmText" style="margin:0;font-size:13.5px;"></p>
    <div class="dialog-actions"><button class="btn" value="no">Annuler</button><button class="btn primary" value="yes" id="confirmOk">Confirmer</button></div>
  </form>
</dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>


<script type="module" src="js/main.js"></script>
</body>
</html>
